<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520">
  <rect width="640" height="520" fill="#ffffff"/>
  <g stroke="#222" stroke-width="6" stroke-linecap="square" fill="none">
    <!-- Borde superior (frente, z=0) con hueco de puerta de acceso -->
    <line x1="50" y1="40" x2="410" y2="40"/>
    <line x1="482" y1="40" x2="590" y2="40"/>
    <!-- Borde derecho (x=9) con ventanal del living -->
    <line x1="590" y1="40" x2="590" y2="160"/>
    <line x1="590" y1="340" x2="590" y2="460"/>
    <!-- Borde inferior (fondo, z=7) con ventana de cocina -->
    <line x1="50" y1="460" x2="218" y2="460"/>
    <line x1="302" y1="460" x2="590" y2="460"/>
    <!-- Borde izquierdo (x=0) con ventana de dormitorio -->
    <line x1="50" y1="40" x2="50" y2="100"/>
    <line x1="50" y1="196" x2="50" y2="460"/>
    <!-- Tabique x=5 con puertas a dormitorio y cocina -->
    <line x1="350" y1="40" x2="350" y2="76"/>
    <line x1="350" y1="148" x2="350" y2="328"/>
    <line x1="350" y1="400" x2="350" y2="460"/>
    <!-- Tabique z=4 (dormitorio / cocina-baño) -->
    <line x1="50" y1="280" x2="350" y2="280"/>
    <!-- Tabique x=2 (baño / cocina) con puerta -->
    <line x1="170" y1="280" x2="170" y2="340"/>
    <line x1="170" y1="394" x2="170" y2="460"/>
  </g>
  <!-- Ventanas (azul) -->
  <g stroke="#2e8bd6" stroke-width="6" stroke-linecap="square">
    <line x1="590" y1="160" x2="590" y2="340"/>
    <line x1="50" y1="100" x2="50" y2="196"/>
    <line x1="218" y1="460" x2="302" y2="460"/>
  </g>
  <!-- Etiquetas -->
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#333">
    <text x="200" y="155" font-size="20">Dormitorio</text>
    <text x="200" y="180" font-size="14" fill="#777">18.5 m²</text>
    <text x="470" y="245" font-size="20">Living-comedor</text>
    <text x="470" y="270" font-size="14" fill="#777">26.0 m²</text>
    <text x="260" y="365" font-size="18">Cocina</text>
    <text x="260" y="388" font-size="13" fill="#777">8.0 m²</text>
    <text x="110" y="365" font-size="16">Baño</text>
    <text x="110" y="386" font-size="12" fill="#777">5.0 m²</text>
  </g>
  <!-- Leyenda -->
  <g font-family="system-ui, sans-serif" font-size="13">
    <line x1="50" y1="495" x2="80" y2="495" stroke="#2e8bd6" stroke-width="6"/>
    <text x="88" y="500" fill="#555">Ventana exterior</text>
  </g>
</svg>
